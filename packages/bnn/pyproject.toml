[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "bnn"
version = "0.1.0"
description = "Fit and sample posteriors of Bayesian neural networks, resumable and in parallel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Shared workspace numerical stack.
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "blackjax==1.2.2",
    "optax==0.2.8",
    "jax==0.10.2",
    "flax==0.12.7",
    "rich>=14,<16",
    "zarr>=3.1.3,<3.2",
]

[project.scripts]
bnn = "bnn.cli:main"

[tool.uv.build-backend]
module-root = ""
